name: Release to itch.io
# Manual run: exports the Web build and pushes it to https://veniceissinking.itch.io/swipe-life
on:
  workflow_dispatch:
    inputs:
      version:
        description: userversion shown on itch
        required: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* "$dest/"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import
        run: '"$GODOT" --headless --import'
      - name: Export Web
        run: mkdir -p build/web && "$GODOT" --headless --export-release "Web" build/web/index.html
      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler && ./butler -V
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler push build/web "veniceissinking/swipe-life:html5" --userversion "${{ inputs.version }}"
